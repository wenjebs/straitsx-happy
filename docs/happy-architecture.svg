<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Happy system architecture</title>
  <desc id="desc">Corporate architecture diagram showing the Happy frontend, AWS infrastructure, backend, private closer service, data stores, browser agents, payment services, and merchant websites.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563a6"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #64748b; }
      .zone-title { font-size: 15px; font-weight: 700; letter-spacing: 1.2px; fill: #334155; }
      .node-title { font-size: 17px; font-weight: 700; }
      .node-body { font-size: 13px; fill: #64748b; }
      .edge-label { font-family: Consolas, monospace; font-size: 12px; fill: #526176; }
      .node { fill: #ffffff; stroke: #b9c3d0; stroke-width: 1.5; }
      .aws-node { fill: #ffffff; stroke: #6f9ac8; stroke-width: 1.6; }
      .external-node { fill: #ffffff; stroke: #aab4c1; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2563a6; stroke-width: 2.3; marker-end: url(#arrowBlue); }
      .private-flow { fill: none; stroke: #2563a6; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrowBlue); }
      .bus { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="1800" height="10" fill="#232f3e"/>
  <text x="60" y="68" class="title">Happy — System Architecture</text>
  <text x="60" y="98" class="subtitle">AWS deployment topology, private checkout execution, and external service integrations</text>
  <line x1="60" y1="122" x2="1740" y2="122" stroke="#d8dee7" stroke-width="1"/>

  <!-- Zones -->
  <rect x="60" y="158" width="230" height="704" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="330" y="158" width="990" height="704" rx="8" fill="#f8fbff" stroke="#6f9ac8" stroke-width="2" stroke-dasharray="9 6"/>
  <rect x="1360" y="158" width="380" height="704" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="84" y="192" class="zone-title">CLIENT</text>
  <text x="354" y="192" class="zone-title">AWS CLOUD · AP-SOUTHEAST-1</text>
  <text x="1384" y="192" class="zone-title">EXTERNAL SERVICES</text>

  <!-- Client -->
  <rect x="91" y="304" width="168" height="104" rx="7" class="node"/>
  <rect x="111" y="328" width="42" height="31" rx="3" fill="#eaf2fb" stroke="#2563a6" stroke-width="1.5"/>
  <line x1="118" y1="367" x2="146" y2="367" stroke="#2563a6" stroke-width="2" stroke-linecap="round"/>
  <text x="170" y="344" class="node-title">User</text>
  <text x="170" y="367" class="node-body">Web browser</text>
  <text x="111" y="390" class="edge-label">HTTPS</text>

  <!-- CloudFront -->
  <path d="M259 356H385" class="flow-blue"/>
  <text x="302" y="341" class="edge-label">HTTPS</text>

  <rect x="387" y="301" width="190" height="110" rx="7" class="aws-node"/>
  <rect x="387" y="301" width="8" height="110" rx="4" fill="#2563a6"/>
  <text x="417" y="339" class="node-title">Amazon CloudFront</text>
  <text x="417" y="365" class="node-body">Single public origin</text>
  <text x="417" y="389" class="edge-label">/  and  /v1/*</text>

  <!-- S3 and ALB -->
  <path d="M577 335H618V269H661" class="flow"/>
  <text x="594" y="257" class="edge-label">static assets</text>
  <rect x="663" y="224" width="188" height="90" rx="7" class="aws-node"/>
  <rect x="663" y="224" width="8" height="90" rx="4" fill="#4b9b72"/>
  <text x="692" y="262" class="node-title">Amazon S3</text>
  <text x="692" y="286" class="node-body">React frontend build</text>

  <path d="M577 378H618V425H661" class="flow"/>
  <text x="588" y="418" class="edge-label">/v1/*</text>
  <rect x="663" y="380" width="188" height="90" rx="7" class="aws-node"/>
  <rect x="663" y="380" width="8" height="90" rx="4" fill="#7c66b2"/>
  <text x="692" y="418" class="node-title">Application LB</text>
  <text x="692" y="442" class="node-body">HTTP listener · port 80</text>

  <!-- ECS task boundary -->
  <path d="M851 425H912" class="flow-blue"/>
  <text x="866" y="412" class="edge-label">API</text>

  <rect x="914" y="214" width="352" height="370" rx="8" fill="#f4f8fd" stroke="#4d83b8" stroke-width="1.8"/>
  <text x="938" y="246" class="zone-title">ECS FARGATE TASK</text>
  <text x="1239" y="246" text-anchor="end" class="edge-label" fill="#2f6f4e">PRIVATE</text>

  <rect x="950" y="281" width="280" height="105" rx="7" class="aws-node"/>
  <rect x="950" y="281" width="8" height="105" rx="4" fill="#2563a6"/>
  <text x="982" y="318" class="node-title">Backend API</text>
  <text x="982" y="343" class="node-body">Mandates · activities · purchases</text>
  <text x="982" y="365" class="edge-label">Node.js · :8787 · @happy/pay</text>

  <rect x="950" y="447" width="280" height="105" rx="7" class="aws-node"/>
  <rect x="950" y="447" width="8" height="105" rx="4" fill="#d58328"/>
  <text x="982" y="484" class="node-title">Closer Service</text>
  <text x="982" y="509" class="node-body">Browser-driven checkout execution</text>
  <text x="982" y="531" class="edge-label">Node.js · :4042 · no public route</text>

  <path d="M1032 386V445" class="private-flow"/>
  <text x="1045" y="411" class="edge-label">jobs + live view</text>
  <path d="M1182 447V388" class="private-flow"/>
  <text x="1147" y="432" class="edge-label">callbacks</text>

  <!-- AWS managed services -->
  <text x="370" y="639" class="zone-title">MANAGED SERVICES</text>

  <rect x="370" y="667" width="180" height="105" rx="7" class="aws-node"/>
  <rect x="370" y="667" width="8" height="105" rx="4" fill="#4b9b72"/>
  <text x="397" y="705" class="node-title">DynamoDB</text>
  <text x="397" y="730" class="node-body">Activities and wallets</text>
  <text x="397" y="751" class="edge-label">persistent state</text>

  <rect x="570" y="667" width="180" height="105" rx="7" class="aws-node"/>
  <rect x="570" y="667" width="8" height="105" rx="4" fill="#c8872b"/>
  <text x="597" y="705" class="node-title">Secrets Manager</text>
  <text x="597" y="730" class="node-body">Keys and tokens</text>
  <text x="597" y="751" class="edge-label">runtime secrets</text>

  <rect x="770" y="667" width="180" height="105" rx="7" class="aws-node"/>
  <rect x="770" y="667" width="8" height="105" rx="4" fill="#7c66b2"/>
  <text x="797" y="705" class="node-title">Cognito</text>
  <text x="797" y="730" class="node-body">User authentication</text>
  <text x="797" y="751" class="edge-label">login + identity</text>

  <rect x="970" y="667" width="276" height="105" rx="7" class="aws-node"/>
  <rect x="970" y="667" width="8" height="105" rx="4" fill="#2e8a96"/>
  <text x="997" y="705" class="node-title">Bedrock AgentCore</text>
  <text x="997" y="730" class="node-body">Scout and checkout browsers</text>
  <text x="997" y="751" class="edge-label">isolated browser sessions</text>

  <!-- Backend connections to AWS services -->
  <path d="M950 350H930V620H460" class="bus"/>
  <path d="M460 620H1108" class="bus"/>
  <path d="M460 620V665" class="flow"/>
  <path d="M660 620V665" class="flow"/>
  <path d="M860 620V665" class="flow"/>
  <path d="M1108 620V665" class="flow"/>
  <path d="M1160 552V642H1164V665" class="flow"/>

  <!-- External services -->
  <rect x="1402" y="225" width="296" height="96" rx="7" class="external-node"/>
  <rect x="1402" y="225" width="8" height="96" rx="4" fill="#172033"/>
  <text x="1434" y="263" class="node-title">OpenAI API</text>
  <text x="1434" y="288" class="node-body">Planner and scout reasoning</text>

  <rect x="1402" y="376" width="296" height="96" rx="7" class="external-node"/>
  <rect x="1402" y="376" width="8" height="96" rx="4" fill="#d58328"/>
  <text x="1434" y="414" class="node-title">StraitsX Card API</text>
  <text x="1434" y="439" class="node-body">x402 one-time card issuance</text>

  <rect x="1402" y="527" width="296" height="96" rx="7" class="external-node"/>
  <rect x="1402" y="527" width="8" height="96" rx="4" fill="#ce5d35"/>
  <text x="1434" y="565" class="node-title">Avalanche C-Chain</text>
  <text x="1434" y="590" class="node-body">XSGD settlement rail</text>

  <rect x="1402" y="678" width="296" height="96" rx="7" class="external-node"/>
  <rect x="1402" y="678" width="8" height="96" rx="4" fill="#4f6b88"/>
  <text x="1434" y="716" class="node-title">Merchant Websites</text>
  <text x="1434" y="741" class="node-body">Listings and checkout pages</text>

  <!-- External connections -->
  <path d="M1230 320H1351V273H1400" class="flow"/>
  <text x="1261" y="306" class="edge-label">planning</text>

  <path d="M1230 345H1336V424H1400" class="flow"/>
  <text x="1261" y="370" class="edge-label">issue exact-total card</text>

  <path d="M1230 369H1322V575H1400" class="flow"/>
  <text x="1261" y="551" class="edge-label">settle XSGD</text>

  <path d="M1246 720H1400" class="flow-blue"/>
  <text x="1274" y="706" class="edge-label">browser sessions</text>

  <!-- Footer / legend -->
  <line x1="60" y1="904" x2="1740" y2="904" stroke="#d8dee7" stroke-width="1"/>
  <line x1="72" y1="941" x2="128" y2="941" class="flow-blue"/>
  <text x="144" y="946" class="node-body">Request or data flow</text>
  <line x1="335" y1="941" x2="391" y2="941" class="private-flow"/>
  <text x="407" y="946" class="node-body">Private service-to-service flow</text>
  <rect x="683" y="925" width="18" height="30" fill="#f4f8fd" stroke="#4d83b8" stroke-width="1.5"/>
  <text x="715" y="946" class="node-body">AWS trust boundary</text>
  <text x="1740" y="946" text-anchor="end" class="edge-label">Source: ARCHITECTURE.md</text>
</svg>
